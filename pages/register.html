<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeakPro | Register</title>
<link rel="icon" type="image/png" href="../assets/images/mic.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

/* ===============================
   GLOBAL
================================= */
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#0d2c54,#1e3a8a);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:0;
}

/* Glow background */
body::before,
body::after{
  content:"";
  position:absolute;
  border-radius:50%;
  filter:blur(120px);
  opacity:.4;
}

body::before{
  width:300px;
  height:300px;
  background:#f9a826;
  top:-100px;
  left:-100px;
}

body::after{
  width:400px;
  height:400px;
  background:#ffffff;
  bottom:-150px;
  right:-150px;
}

/* ===============================
   AUTH CARD
================================= */
.auth-card{
  width:420px;
  max-width:95%;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(20px);
  border-radius:30px;
  padding:50px 35px;
  box-shadow:0 30px 80px rgba(0,0,0,.3);
  position:relative;
  z-index:2;
  color:#fff;
  text-align:center;
}

/* Logo */
.logo{
  font-size:28px;
  font-weight:700;
  color:#f9a826;
  text-decoration:none;
  display:block;
  margin-bottom:25px;
}

.logo:hover{
  color:#fff;
}

/* Title */
.auth-card h2{
  font-weight:700;
  margin-bottom:30px;
}

/* Input group */
.input-group{
  margin-bottom:18px;
}

.input-group-text{
  border-radius:30px 0 0 30px;
  background:#f9a826;
  color:#0d2c54;
  border:none;
}

.form-control{
  border-radius:0 30px 30px 0 !important;
  border:none;
  padding:12px 15px !important;
}

.form-control:focus{
  box-shadow:none;
}

/* Register Button */
.btn-register{
  width:100%;
  background:#f9a826;
  color:#0d2c54;
  border:none;
  padding:12px;
  border-radius:40px;
  font-weight:600;
  transition:.3s;
  box-shadow:0 15px 40px rgba(249,168,38,.5);
  margin-top:10px;
}

.btn-register:hover{
  transform:translateY(-3px);
  box-shadow:0 25px 60px rgba(249,168,38,.7);
}

/* Login Link */
.login-text{
  margin-top:20px;
  font-size:14px;
}

.login-text a{
  color:#f9a826;
  text-decoration:none;
}

@media(max-width:576px){
  .auth-card{
    padding:40px 25px;
  }
}

</style>
</head>
<body>

<div class="auth-card">

  <a href="../index.html" class="logo">SpeakPro</a>

  <h2>Create Account</h2>

  <form action="dashboard.html">

    <div class="input-group">
      <span class="input-group-text"><i class="fas fa-user"></i></span>
      <input type="text" class="form-control" placeholder="Full Name" required>
    </div>

    <div class="input-group">
      <span class="input-group-text"><i class="fas fa-envelope"></i></span>
      <input type="email" class="form-control" placeholder="Email Address" required>
    </div>

    <div class="input-group">
      <span class="input-group-text"><i class="fas fa-lock"></i></span>
      <input type="password" class="form-control" placeholder="Password" required>
    </div>

    <button type="submit" class="btn-register">Register</button>

  </form>

  <div class="login-text">
    Already have an account? <a href="login.html">Login here</a>
  </div>

</div>

</body>
</html>

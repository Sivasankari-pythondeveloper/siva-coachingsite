<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeakPro | Login</title>
<link rel="icon" type="image/png" href="../assets/images/mic.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

/* ===============================
   GLOBAL
================================= */
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#0d2c54,#1e3a8a);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:0;
}


/* Background glow */
body::before,
body::after{
  content:"";
  position:absolute;
  border-radius:50%;
  filter:blur(120px);
  opacity:.4;
}

body::before{
  width:300px;
  height:300px;
  background:#f9a826;
  top:-100px;
  left:-100px;
}

body::after{
  width:400px;
  height:400px;
  background:#ffffff;
  bottom:-150px;
  right:-150px;
}

/* ===============================
   AUTH CARD
================================= */
.auth-card{
  width:420px;
  max-width:95%;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(20px);
  border-radius:30px;
  padding:50px 35px;
  box-shadow:0 30px 80px rgba(0,0,0,.3);
  position:relative;
  z-index:2;
  color:#fff;
  text-align:center;
}

/* Logo */
.logo{
  font-size:28px;
  font-weight:700;
  color:#f9a826;
  text-decoration:none;
  display:block;
  margin-bottom:25px;
}

.logo:hover{
  color:#fff;
}

/* Title */
.auth-card h2{
  font-weight:700;
  margin-bottom:30px;
}

/* Input group */
.input-group{
  margin-bottom:20px;
}

.input-group-text{
  border-radius:30px 0 0 30px;
  background:#f9a826;
  color:#0d2c54;
  border:none;
}

.form-control{
  border-radius:0 30px 30px 0 !important;
  border:none;
  padding:12px 15px !important;
}

.form-control:focus{
  box-shadow:none;
}

/* Forgot */
.forgot{
  text-align:right;
  font-size:14px;
  margin-bottom:20px;
}

.forgot a{
  color:#f9a826;
  text-decoration:none;
}

/* Login Button */
.btn-login{
  width:100%;
  background:#f9a826;
  color:#0d2c54;
  border:none;
  padding:12px;
  border-radius:40px;
  font-weight:600;
  transition:.3s;
  box-shadow:0 15px 40px rgba(249,168,38,.5);
}

.btn-login:hover{
  transform:translateY(-3px);
  box-shadow:0 25px 60px rgba(249,168,38,.7);
}

/* Divider */
.divider{
  margin:30px 0 20px;
  position:relative;
  font-size:14px;
}

.divider::before{
  content:"";
  position:absolute;
  width:100%;
  height:1px;
  background:rgba(255,255,255,.3);
  top:50%;
  left:0;
  z-index:1;
}

.divider span{
  background:rgba(13,44,84,0.9);
  padding:0 15px;
  position:relative;
  z-index:2;
}

/* ===============================
   SOCIAL ICON BUTTONS
================================= */
.social-icons{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:10px;
}

.social-icon{
  width:50px;
  height:50px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  transition:.3s;
  cursor:pointer;
}

/* Individual Colors */
.google{
  background:#ffffff;
  color:#db4437;
}

.facebook{
  background:#1877f2;
  color:#fff;
}

.twitter{
  background:#1da1f2;
  color:#fff;
}

.social-icon:hover{
  transform:translateY(-5px);
  box-shadow:0 10px 25px rgba(0,0,0,.4);
}

/* Register */
.register{
  margin-top:25px;
  font-size:14px;
}

.register a{
  color:#f9a826;
  text-decoration:none;
}

@media(max-width:576px){
  .auth-card{
    padding:40px 25px;
  }
}

</style>
</head>
<body>

<div class="auth-card">

  <a href="../index.html" class="logo">SpeakPro</a>

  <h2>Welcome Back</h2>

  <form action="dashboard.html">

    <div class="input-group">
      <span class="input-group-text"><i class="fas fa-envelope"></i></span>
      <input type="email" class="form-control" placeholder="Email Address" required>
    </div>

    <div class="input-group">
      <span class="input-group-text"><i class="fas fa-lock"></i></span>
      <input type="password" class="form-control" placeholder="Password" required>
    </div>

    <div class="forgot">
      <a href="forgot-password.html">Forgot Password?</a>
    </div>

    <button type="submit" class="btn-login">Login</button>

  </form>

  <div class="divider">
    <span>or continue with</span>
  </div>

  <!-- ICON ONLY SOCIAL LOGIN -->
  <div class="social-icons">
    <div class="social-icon google">
      <i class="fab fa-google"></i>
    </div>

    <div class="social-icon facebook">
      <i class="fab fa-facebook-f"></i>
    </div>

    <div class="social-icon twitter">
      <i class="fab fa-twitter"></i>
    </div>
  </div>

  <div class="register">
    New to SpeakPro? <a href="register.html">Create Account</a>
  </div>

</div>

</body>
</html>
